name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fail_fast:
        description: Cancel other matrix jobs after the first failure
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / C++17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ inputs.fail_fast || false }}
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 -DDATACONV_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results.xml
          if-no-files-found: warn
          retention-days: 14
